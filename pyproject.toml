# 项目元数据与工具配置
# 本仓库是桌面应用（非发布到 PyPI 的库），这里的依赖/元数据同时供 CI 与
# 本地 `pip install -e ".[dev]"` 使用，具体 pinned 上界见 requirements.txt。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douban-post-collector"
version = "1.1.0"
description = "豆瓣小组帖子采集器：抓取、图片下载、OCR 与 AI 分析"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5.0,<7",
    "PySide6-WebEngine>=6.5.0,<7",
    "requests>=2.28.0,<3",
    "curl_cffi>=0.8.0,<1",
    "pytesseract>=0.3.10,<0.4",
    "Pillow>=10.0.0,<13",
]

[project.optional-dependencies]
rapidocr = ["rapidocr-onnxruntime>=1.3.0,<2"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
dbp = "douban_gui:main"

[tool.setuptools]
py-modules = ["douban_gui"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["assets", "doc", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
